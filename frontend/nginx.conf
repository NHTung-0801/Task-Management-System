# =============================================
# Cấu hình Nginx cho React SPA
# - Mọi request tới file tĩnh → trả file trực tiếp
# - Mọi route khác → trả index.html (để React Router xử lý)
# - Request /api/* → proxy tới backend container
# =============================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests sang backend container
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve file tĩnh (JS, CSS, hình ảnh)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: mọi route khác → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
